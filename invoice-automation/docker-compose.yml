services:
  postgres:
    image: postgres:16
    container_name: invoice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: YOUR_USER
      POSTGRES_PASSWORD: YOUR_PASS
      POSTGRES_DB: invoices
    ports:
      - "YOUR_PORTS"
    volumes:
      - invoice_pgdata:/var/lib/postgresql/data

volumes:
  invoice_pgdata:
